services:
  db:
    image: postgres:16-alpine
    container_name: ehsan-admin-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ehsan
      POSTGRES_PASSWORD: ehsan_dev
      POSTGRES_DB: ehsan_admin
    ports: ["5432:5432"]
    volumes: ["ehsan-pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ehsan -d ehsan_admin"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  ehsan-pgdata:
