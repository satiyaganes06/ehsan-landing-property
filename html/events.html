<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Events — Ehsan Plant &amp; Property</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600&family=Azeret+Mono:wght@300;400;500&family=Fraunces:ital,opsz,wght@0,9..144,300..500;1,9..144,300..500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/content.css">
<link rel="stylesheet" href="../css/events.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%230a0b0d%27/%3E%3Cpath d=%27M6 24V8h20v4H11v3h12v4H11v3h15v2z%27 fill=%27%23d18829%27/%3E%3C/svg%3E">
<meta name="description" content="Property launches, open houses and investment briefings from Ehsan Plant &amp; Property across Malaysia.">
</head>
<body>

<div data-component="navbar"></div>

<div class="grain" aria-hidden="true"></div>

<main class="events-page">
  <div class="events-page__inner">

    <header class="events-page__head">
      <a href="../index.html#events" class="events-page__back">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Back to home
      </a>

      <p class="events-page__label">Events</p>
      <h1 class="events-page__title">Every event, <em>one page</em>.</h1>
      <p class="events-page__lede">
        Launches, open houses, site days and financing clinics across Malaysia.
        Registration is free for every event on this page.
      </p>
    </header>

    <!-- Category filter. Rendered by events.js from the data, so it never falls
         out of step with the categories actually present. -->
    <div class="events-filter" id="eventsFilter" role="group" aria-label="Filter events by category"></div>

    <p class="events-count" id="eventsCount" role="status" aria-live="polite"></p>

    <div class="events-grid" id="eventsList"></div>

    <p class="events-empty" id="eventsEmpty" hidden>No events in this category.</p>

  </div>
</main>

<div data-component="footer"></div>

<div data-component="assistant"></div>

<!-- Page chrome: registry first, then each component, then mount. -->
<script src="../components/registry.js"></script>
<script src="../components/navbar.js"></script>
<script src="../components/footer.js"></script>
<script src="../components/assistant.js"></script>
<script src="../components/mount.js"></script>

<!-- Page behaviour — runs after the chrome is in the DOM. -->
<script src="../js/events.js"></script>
<script src="../js/content.js"></script>
</body>
</html>
