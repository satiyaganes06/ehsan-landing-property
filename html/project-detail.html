<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Details — Ehsan Plant &amp; Property</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600&family=Azeret+Mono:wght@300;400;500&family=Fraunces:ital,opsz,wght@0,9..144,300..500;1,9..144,300..500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/content.css">
<link rel="stylesheet" href="../css/project-detail.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%230a0b0d%27/%3E%3Cpath d=%27M6 24V8h20v4H11v3h12v4H11v3h15v2z%27 fill=%27%23d18829%27/%3E%3C/svg%3E">
</head>
<body>

<div data-component="navbar"></div>

<div class="grain" aria-hidden="true"></div>

<!-- Hero Section with Carousel -->
<div class="hero-wrapper">
  <div class="project-hero">
    <!-- Media Switcher Overlay (top-right) -->
    <div class="media-switcher" id="mediaSwitcher">
      <button class="media-switcher__btn is-active" data-media="image" aria-label="View images">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        <span>Images</span>
      </button>
      <button class="media-switcher__btn" data-media="video" aria-label="View videos" style="display:none">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
        <span>Video</span>
      </button>
      <button class="media-switcher__btn" data-media="blueprint" aria-label="View blueprints" style="display:none">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M3 6h18M3 18h18M6 3v18M12 3v18M18 3v18"/></svg>
        <span>Blueprint</span>
      </button>
    </div>

    <!-- Carousel -->
    <div class="carousel" id="carousel">
      <div class="carousel__container">
        <div class="carousel__track" id="carouselTrack"></div>
      </div>

      <!-- Navigation -->
      <button class="carousel__nav carousel__nav--prev" id="carouselPrev" aria-label="Previous image">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <button class="carousel__nav carousel__nav--next" id="carouselNext" aria-label="Next image">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>

      <!-- Counter -->
      <div class="carousel__counter">
        <span id="carouselCurrent">1</span> / <span id="carouselTotal">1</span>
      </div>
    </div>
  </div>

  <!-- Project header with title and location -->
  <div class="project-header">
    <div class="project-header__inner">
      <h1 class="project-header__title" id="projectTitle"></h1>
      <div class="project-header__meta">
        <span class="project-header__location" id="projectLocation"></span>
        <span class="project-header__year" id="projectYear"></span>
        <span class="project-header__status" id="projectStatus"></span>
      </div>
    </div>
  </div>

  

  <!-- Image Gallery Grid -->
  <div class="gallery-section">
    <div class="gallery-container">
      <div id="imageGalleryContainer" class="image-gallery"></div>
      <div id="blueprintGalleryContainer" class="image-gallery" style="display:none;"></div>
    </div>
  </div>

  <div class="project-content">
  <div class="project-content__inner">
    <!-- About the Property -->
    <section class="project-section">
      <h2 class="project-section__title">About this project</h2>
      <p class="project-section__prose" id="projectDescription"></p>
    </section>

    <!-- Features/Amenities -->
    <section class="project-section" id="projectAmenitiesSection">
      <h2 class="project-section__title">Features & amenities</h2>
      <div id="projectAmenities"></div>
    </section>

    <!-- Quick specs grid -->
    <section class="project-section">
      <h2 class="project-section__title">Project specifications</h2>
      <div class="specs-grid" id="projectSpecsGrid"></div>
    </section>

    <!-- Certificate section (if applicable) -->
    <section class="project-section" id="projectCert" style="display:none;">
      <h2 class="project-section__title">Certificate of Completion</h2>
      <div class="project-cert-content">
        <p id="projectCertText"></p>
      </div>
    </section>

  

  </div>
</div>

  <!-- Google Maps Section -->
  <div class="maps-section">
    <div class="maps-container">
      <h2 class="maps-title">Location</h2>
      <div class="maps-wrapper">
        <div id="projectMap" class="maps-embed"></div>
      </div>
    </div>
  </div>
</div>

<!-- Lightbox Modal -->
<div class="lightbox" id="lightbox" aria-hidden="true">
  <div class="lightbox__backdrop"></div>
  <div class="lightbox__content">
    <button class="lightbox__close" id="lightboxClose" aria-label="Close lightbox">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <button class="lightbox__nav lightbox__nav--prev" id="lightboxPrev" aria-label="Previous image">
      <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <div class="lightbox__image-wrapper">
      <img class="lightbox__image" id="lightboxImage" src="" alt="Full size image">
    </div>
    <button class="lightbox__nav lightbox__nav--next" id="lightboxNext" aria-label="Next image">
      <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </button>
    <div class="lightbox__counter">
      <span id="lightboxCurrent">1</span> / <span id="lightboxTotal">1</span>
    </div>
  </div>
</div>



<!-- Sticky CTA Button -->
<!-- <div class="sticky-cta">
  <a href="../index.html#contact" class="btn btn--solid">Schedule a tour</a>
</div> -->

<div data-component="footer"></div>

<div data-component="assistant"></div>

<!-- Page chrome: registry first, then each component, then mount. -->
<script src="../components/registry.js"></script>
<script src="../components/navbar.js"></script>
<script src="../components/footer.js"></script>
<script src="../components/assistant.js"></script>
<script src="../components/mount.js"></script>

<!-- Page behaviour — runs after the chrome is in the DOM. -->
<script src="../js/project-detail.js"></script>
<script src="../js/content.js"></script>
</body>
</html>
